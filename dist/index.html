<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6efe2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1410" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Us">
<title>Us</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/bitter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <h1><span class="logo" id="logo" aria-hidden="true"></span> <span id="appname">Us</span></h1>
  <div id="who" class="who" role="group" aria-label="Who's using the app"></div>
  <button class="gear" data-tab="settings" aria-label="Settings">⚙️</button>
</header>
<div id="sample" class="samplebar" hidden>Sample data shown. Play around, then reset or clear it in ⚙️ Settings. <button id="dismiss-sample">Got it</button></div>
<main id="view"></main>
<nav class="tabbar" aria-label="Main">
  <button data-tab="feed"><span aria-hidden="true">🏡</span>Porch</button>
  <button data-tab="calendar"><span aria-hidden="true">🗓️</span>Round-Up</button>
  <button data-tab="dates"><span aria-hidden="true">🌻</span>Date Night</button>
  <button data-tab="trips"><span aria-hidden="true">🐎</span>Trail Fund</button>
  <button data-tab="lists"><span aria-hidden="true">🧺</span>Chores</button>
</nav>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
